[package]
name = "level_1_rl_expanded"
version = "0.1.0"
edition = "2021"
description = "A hands-on Rust lab for probability, finite-horizon planning, and TD value learning"
license = "MIT"
repository = "https://github.com/hghalebi/rizz-rl"
readme = "README.md"
keywords = ["reinforcement", "learning", "education", "probability", "bellman"]
categories = ["science", "command-line-utilities"]

[dependencies]
rand = { version = "=0.9.2", default-features = false, features = ["std"] }
rand_chacha = "=0.9.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Clippy's default lints plus the stricter pedantic, nursery, and cargo groups.
# `scripts/check.py` and CI run Clippy with `-D warnings`, so these fail the build.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
